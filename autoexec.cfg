// Audio

volume 1
snd_headphone_eq 0
snd_spatialize_lerp 0.5
snd_steamaudio_enable_perspective_correction 1
snd_voipvolume 0.36

// Music

snd_menumusic_volume 0
snd_roundstart_volume 0
snd_roundaction_volume 0
snd_roundend_volume 0
snd_mvp_volume 0.04
snd_mapobjective_volume 0
snd_tensecondwarning_volume 0.04
snd_deathcamera_volume 0
snd_mute_mvp_music_live_players 1

// Crosshair

cl_crosshairstyle 4
cl_crosshair_friendly_warning 0
cl_crosshair_recoil 0
cl_crosshairdot 0
cl_crosshairsize 2
cl_crosshairthickness 0
cl_crosshairgap -2
cl_crosshaircolor 4
cl_crosshaircolor_r 0
cl_crosshaircolor_g 255
cl_crosshaircolor_b 145
cl_crosshairusealpha 1
cl_crosshairalpha 255

// Sensitivity

sensitivity 1.3

// Viewmodel

viewmodel_presetpos 2

// Radar

cl_radar_scale 0.5
cl_radar_scale_dynamic 1

// Bind & Alias 

unbind mwheelup
bind mwheeldown +jump
bind c slot7
bind v slot10
bind n noclip
bind / toggle volume 0.01 1
bind . toggle snd_voipvolume 0.01 0.36
alias wup map_workshop 3070389038 csstats

// Et al

mm_dedicated_search_maxping 100
cl_showloadout 1
cl_autobuy vesthelm vest m4a1_silencer ak47 mp9 galilar
cl_predict_kill_ragdolls 0
cl_show_observer_crosshair 2
cl_silencer_mode 0
cl_sniper_show_inaccuracy 0
cl_hud_color 0
cl_hud_telemetry_frametime_show 2
cl_hud_telemetry_net_misdelivery_show 2
cl_hud_telemetry_ping_show 2
cl_teamid_overhead_colors_show 1
cl_teamid_overhead_mode 3
cl_weapon_selection_rarity_color 1
safezonex 1
safezoney 1

echo Puss gets the boot
